
name: CI/CD backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: despliegue-backend
  cancel-in-progress: false

jobs:
  compilar:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

  desplegar:
    name: Construir y desplegar en Ubuntu Server
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, museos-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t museos-backend:latest .


      - name: Actualizar backend
        working-directory: /srv/servicios/museos
        run: |
          set -e

          flock /tmp/museos-deploy.lock -c '
            docker compose up -d backend

            echo "Esperando que el backend esté saludable..."

            for i in $(seq 1 30); do
              estado=$(docker inspect --format "{{.State.Health.Status}}" museos-backend)

              if [ "$estado" = "healthy" ]; then
                echo "Backend saludable"
                docker compose ps
                exit 0
              fi

              sleep 5
            done

            echo "El backend no quedó saludable"
            docker logs --tail 50 museos-backend
            exit 1
          '
