spring:
  application:
    name: museos-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/museos}
    username: ${DB_USER:museos}
    password: ${DB_PASSWORD:museos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080
  shutdown: graceful
  # Detrás de nginx: respeta los encabezados X-Forwarded-* (útil para que Swagger use la URL correcta)
  forward-headers-strategy: framework

# Solo se expone el estado de salud (/actuator/health), sin detalles internos
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-minutes: 15
    refresh-days: 7
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    admin-password: ${ADMIN_PASSWORD:Admin12345}
